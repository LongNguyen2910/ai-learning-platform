[project]
name = "ai-learning-platform-api"
version = "0.1.0"
description = "FastAPI Modular Monolith for AI Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "qdrant-client>=1.8.0",
    "llama-index>=0.10.20",
    "llama-index-vector-stores-qdrant>=0.1.4",
    "llama-index-embeddings-google-genai>=0.6.0",
    "google-generativeai>=0.4.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "google-genai>=2.31.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "langchain-community<0.4.0",
    "langchain-google-genai>=4.4.2",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ragas>=0.4.3",
    "ruff>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
ignore = [
    "B008",      # Do not perform function call `File`/`Form` in argument defaults (FastAPI standard)
    "ASYNC230",  # Async functions opening local files synchronously in background task
    "BLE001",    # Catching generic Exception in outer service/retry handler
]

[tool.uv]
link-mode = "copy"
